name: "Swift: Sync Latest Release"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC

jobs:

  # ===========================================================================
  # MIRROR: Keep main in sync with upstream to prevent inactivity timeout
  # ===========================================================================

  mirror:
    name: Mirror Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: swift
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Sync upstream branch
        run: |
          git remote add upstream https://github.com/libgit2/libgit2.git
          git fetch upstream main
          git push origin upstream/main:refs/heads/upstream --force

  # ===========================================================================
  # SYNC: Check for new upstream tags and prepare release
  # ===========================================================================

  sync:
    name: Sync Upstream
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.upstream.outputs.version }}
      upstream: ${{ steps.upstream.outputs.upstream }}
      branch: ${{ steps.branch.outputs.branch }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: swift
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/libgit2/libgit2.git

      - name: Fetch upstream tags
        run: git fetch upstream --tags

      - name: Get latest upstream version
        id: upstream
        run: |
          UPSTREAM=$(git tag -l 'v*' --sort=-v:refname | head -1)
          VERSION="${UPSTREAM#v}"
          echo "Latest upstream: $UPSTREAM (version $VERSION)"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: check
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release needed: $VERSION"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup stale release branch
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          BRANCH: release/${{ steps.upstream.outputs.version }}
        run: |
          if ! gh pr list --base swift --head "$BRANCH" --state open --json number --jq 'length > 0' | grep -qx true; then
            git push origin --delete "$BRANCH" || true
          fi

      - name: Prepare release branch
        id: branch
        if: steps.check.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM: ${{ steps.upstream.outputs.upstream }}
          BRANCH: release/${{ steps.upstream.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            # Resume an existing release PR without changing its tested commit.
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Create release branch from swift (our source of truth).
          git checkout -b "$BRANCH" origin/swift

          # Merge the upstream tag into our branch
          git merge "$UPSTREAM" -m "Merge upstream $UPSTREAM" --no-edit

          # Push release branch for testing
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # PULL REQUEST: Create release
  # ===========================================================================

  pull-request:
    name: Create Release Pull Request
    needs: [sync]
    if: needs.sync.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.sync.outputs.branch }}
          VERSION: ${{ needs.sync.outputs.version }}
          UPSTREAM: ${{ needs.sync.outputs.upstream }}
        run: |
          NUMBER=$(gh pr list --base swift --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
            gh pr create --base swift --head "$BRANCH" --title "Release $VERSION" --body "Automated release of [libgit2 $UPSTREAM](https://github.com/libgit2/libgit2/releases/tag/$UPSTREAM) with Swift Package Manager support."
            NUMBER=$(gh pr list --base swift --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pull-request.outputs.number }}
        run: gh pr merge "$NUMBER" --auto --merge

  # ===========================================================================
  # FAILURE NOTIFICATION: Create issue if sync fails
  # ===========================================================================

  failure-notification:
    name: Failure Notification
    needs: [sync, pull-request]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.sync.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Sync failed for ${VERSION:-unknown}" \
            --label "sync-failure" \
            --body "The automated sync workflow failed.

          **Version:** ${VERSION:-unknown}
          **Run:** $RUN_URL

          Please investigate and resolve manually."
