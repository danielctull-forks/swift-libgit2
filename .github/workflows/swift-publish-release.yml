name: "Swift: Publish Release"

on:
  pull_request:
    branches: [swift]
    types: [closed]

jobs:
  publish:
    name: Publish Release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out merged release
        uses: actions/checkout@v4
        with:
          ref: swift
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          VERSION="${BRANCH#release/}"
          UPSTREAM="v$VERSION"

          if [ "$VERSION" = "$BRANCH" ] || ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z.]+)?$'; then
            echo "Release branch must use release/<version>: $BRANCH" >&2
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            test "$(git rev-parse "$VERSION^{commit}")" = "$MERGE_SHA"
          else
            git tag "$VERSION" "$MERGE_SHA"
            git push origin "$VERSION"
          fi

          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "Automated release of [libgit2 $UPSTREAM](https://github.com/libgit2/libgit2/releases/tag/$UPSTREAM) with Swift Package Manager support."
          fi

      - name: Delete release branch
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH"
